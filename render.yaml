services:
  - type: web
    name: astroproject
    runtime: node
    plan: free
    region: oregon
    branch: main
    rootDir: .
    buildCommand: npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: FRONTEND_URL
        sync: false
